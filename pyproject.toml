[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "constitution-lint"
version = "1.3.0"
description = "Heuristic checker for CLAUDE.md-style autonomous-agent constitution files: missing spend limits, injection defense, escalation paths, secrets handling."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Agent Ops Kit" }]
keywords = ["claude-code", "ai-agents", "llm-agents", "linter", "ci", "pre-commit", "autonomous-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/joeyycli/constitution-lint-action"
Repository = "https://github.com/joeyycli/constitution-lint-action"

[project.scripts]
constitution-lint = "constitution_lint:main_entry"
constitution-lint-mcp = "constitution_lint_mcp:main"

[tool.hatch.build.targets.wheel]
include = ["constitution_lint.py", "constitution_lint_mcp.py"]
